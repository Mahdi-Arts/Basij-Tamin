<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نمونهٔ درج ویجت نیات خیر</title>
  <style>
    @font-face {
      font-family: Vazirmatn;
      src: url('fonts/Vazirmatn-Regular.woff2') format('woff2');
      font-display: swap;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #173923;
      background: linear-gradient(135deg, #f3f8f3, #e0efe3);
      font-family: Vazirmatn, Tahoma, sans-serif;
    }

    .organization-demo {
      width: min(100% - 2rem, 1080px);
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }

    .organization-demo__header,
    .organization-demo__content {
      padding: clamp(1.25rem, 4vw, 2.5rem);
      border: 1px solid rgba(30, 89, 57, .12);
      border-radius: 24px;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 18px 48px rgba(30, 89, 57, .12);
    }

    .organization-demo__header { margin-bottom: 1rem; }
    .organization-demo__header h1 { margin: 0 0 .5rem; font-size: clamp(1.35rem, 4vw, 2rem); }
    .organization-demo__header p { margin: 0; color: #50705a; }
    .organization-demo__content { text-align: center; }
    .organization-demo__content p { margin-top: 0; color: #50705a; }
    .organization-demo__content > [data-basij-intents] { margin-top: .5rem; }
  </style>
</head>

<body>
  <main class="organization-demo">
    <header class="organization-demo__header">
      <h1>سازمان تأمین اجتماعی</h1>
      <p>این بخش نمونه‌ای از صفحهٔ اصلی سازمان است؛ ویجت نیات خیر فقط با یک دکمه درج شده است.</p>
    </header>

    <section class="organization-demo__content" aria-labelledby="donation-title">
      <h2 id="donation-title">همراهی در کار خیر</h2>
      <p>برای مشاهدهٔ کارت‌ها و انتخاب مسیر پرداخت، دکمهٔ زیر را فعال کنید.</p>
      <button type="button" data-basij-intents>🎯 نمایش نیات خیر</button>
    </section>
  </main>

  <script src="intent-widget.js?v=7.0.1" defer></script>
</body>

</html>
<!-- ساخته شده توسط مهدی باغبانپور بروجنی -->
